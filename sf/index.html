        --muted: #6f6a62;
        --paper: #f4f1ea;

      html {
        background: var(--paper) var(--tooth);
        color: var(--muted);
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      canvas {
        display: block;
        width: 100%;
        max-width: 1400px;
        aspect-ratio: 1400 / 640;
        margin: 0 auto;
      }
      canvas {
        touch-action: pan-y;
        cursor: grab;
        user-select: none;

      p {

      .top {

        align-items: center;

      .back:hover,

        color: var(--fg);
      }
      #theme {
        display: flex;
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      :root[data-theme="dark"] .moon,
      :root[data-theme="light"] .sun {
        display: none;
      }
      kbd {
        font: inherit;
        color: var(--fg);
      }
      #sound {
        font: inherit;
        color: var(--fg);
        background: none;
        border: 1px solid var(--muted);
        border-radius: 99px;
        padding: 2px 10px;
        margin-left: 6px;
        cursor: pointer;

        for (let d = -1; d <= 2; d++) {
          const Z = regions[mod(ct + d, NR)];
          if (!tiles.has(mod(ct + d, NR)) || !Z.strokes) continue;
          const sx = wrapX(Z.x0 - cam, L);
          if (sx >= W + 200 || sx <= -W - 200) continue;
          const slot = Math.floor(t / 2.5);
          for (let j = 0; j < 2; j++) {
            if (!Z.windows.length || hash(slot * 7 + j + Z.x0) < 0.4) continue;
            const wi = Math.floor(hash(slot * 13 + j + Z.x0) * Z.windows.length), [x, y, w, h] = Z.windows[wi];
            Z.dark[wi] ||= sprite(w, h, x, y, () => fill(rect(x + 2, y + 2, w - 4, h - 4), C.dark, Math.min(4, w / 4)));
            drawAt(Z.dark[wi], wrapX(x - cam, L) * DPR, y * DPR);
          }
          for (const a of Z.actors) {
            const q = a.pos(t);
            drawAt(frameOf(a, t), (sx + q.x) * DPR, q.y * DPR);
          }
        }
        for (const a of [...world.actors].reverse()) {
          const q = a.pos(t);
          drawAt(frameOf(a, a === bike ? pedal : t), wrapX(q.x - cam, L) * DPR, q.y * DPR);
        }
        if (card && t - card.born > 12) card = null;
        if (card) {
          vctx.globalAlpha = Math.min(1, (t - card.born) / 0.2, (12 - (t - card.born)) / 0.5);
          drawAt(card.img, wrapX(card.i * W + card.x - cam, L) * DPR, card.y * DPR);
        }
        ringImg ||= sprite(170, 46, 0, 0, () => {
          letters("ring ring", 8, 32, 26, C.dark, 4);
          letters("ring ring", 8, 32, 26, C.yellow, 1.8);
        });
        for (const born of dings.filter((b) => t - b < 1)) {
          vctx.globalAlpha = 1 - (t - born);
          drawAt(ringImg, (BIKE_X + 50) * DPR, (450 - (t - born) * 40) * DPR);
        }
        vctx.globalAlpha = 1;
        while (dings.length && t - dings[0] >= 1) dings.shift();
        listen(t);
        requestAnimationFrame(frame);
      }
    </script>
  </body>
</html>
